<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<!-- 
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    /> -->

    <meta name="theme-color" content="#7B1E3A" />

    <link rel="manifest" href="/manifest.json" />
    
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWtXEl3nt3CNLis9jwjkLiV9jR0RmaE1A&libraries=places"
      async
      defer
    ></script>

    <title>ChowEazy Vendor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style id="expo-reset">
      /* ROOT FONT LOCK */
      html {
        height: 100%;
        font-family: 'Inter', system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: inherit !important;
        background-color: #f9fafb;
        color: #111827;
      }

      /* Expo root */
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        font-family: inherit !important;
      }

      /* FORCE INPUTS & BUTTONS (mobile culprit) */
      input,
      textarea,
      button,
      select {
        font-family: inherit !important;
        font-size: 16px; /* prevents iOS zoom & font override */
      }

      /* Remove tap highlight on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
